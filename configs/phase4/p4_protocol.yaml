# Phase 4 protocol — real-world validation & enhancement gating. Evaluation only; no model selection.
# Extends the frozen Phase 3 protocol (configs/phase3/benchmark_p3.yaml, p3-protocol-1.0.1): same configurations,
# geometry, adapters, weights, metrics and statistics. Phase 4 adds populations, a second evaluator, quality
# features, a gate and routing. Changes after a population's first output require a version bump (P4 docs).
protocol_version: p4-protocol-1.0.0
baseline_protocol: {path: configs/phase3/benchmark_p3.yaml, version: p3-protocol-1.0.1, commit: fdfce67}
seed: 20260928

populations:
  p4dev:                               # SYNTHETIC, DEV split: calibration of the quality gate and routing (P4-T6/T7)
    source: pairs_dev_pilot
    select: {per_stratum: 2, stratify_by: [race, gender], salt: p4-dev}
    exclude_populations: [trial]       # Phase 3 trial refs (dev) were used for pipeline validation; kept out
    manifest_root: data/manifests/phase4
  main:                                # SYNTHETIC, TEST split: the Phase 3 main population, reused unchanged for the
    manifest_root: data/manifests/phase3   # single frozen-gate evaluation (outputs already exist; no re-run)

runtime:
  outputs_root: experiments/phase4     # git-ignored
  workers: 4
  torch_threads_per_worker: 2
  workers_override: {A2: 2}            # VQFR ≈ 3.3 GB/process (Phase 3 incident: 4 workers OOM-killed)
