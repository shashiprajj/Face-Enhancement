# Phase 5 Rapid: benchmark_p3.yaml (p3-protocol-1.0.1) + configurations A6-A8. Everything else unchanged.
# P3-T1 — frozen Phase 3 benchmark protocol (fes-syn-v1). Evaluation only; no model selection.
# Frozen 2026-09-29 BEFORE any candidate output was produced or inspected. Changes require a new protocol version
# and a documented reason (docs/phase_3/P3-T1_Benchmark_Harness_Specification.md §11).
protocol_version: p3-protocol-1.0.1   # 1.0.1 = runtime workers/threads only
benchmark: fes-syn-v1
seed: 20260928                         # fes-syn-v1 global seed (configs/phase2/benchmark_v1.yaml)

inputs:                                # Phase 2 manifests; SHA-256 must equal the P2-T8 evidence (p2t8_hashes_after.txt)
  splits: {path: data/manifests/benchmark/fes-syn-v1/splits.csv.gz,
           sha256: 94bdb5cb8d4c69a10f5b4915c4cae528ec77d50a8f91a77f552d572bb43ba54a}
  pairs_dev_pilot: {path: data/manifests/benchmark/fes-syn-v1/pairs_dev_pilot.csv.gz,
                    sha256: 79cf9aa575865b244785e25678f6e0a8fa599d980f5835cae153f51c7bc147a5}
  pairs_test_core: {path: data/manifests/benchmark/fes-syn-v1/pairs_test_core.csv.gz,
                    sha256: d9a5e72dc34b352ad9e599339c768c5a242e7fd83f8a2d0e41e9c4cea75bc500}

populations:                           # evaluation unit = one (reference, degradation cell) pair; 32 cells per reference
  trial:                               # DEV data only: pipeline/output validation before the main run (P3-T4)
    source: pairs_dev_pilot
    select: {per_stratum: 1, max_refs: 4, stratify_by: [race, gender], salt: p3-trial}
  main:                                # TEST data: the single controlled population every configuration is run on
    source: pairs_test_core
    select: {per_stratum: 2, stratify_by: [race, gender], salt: p3-main}    # 14 strata × 2 = 28 refs × 32 = 896 pairs
  # Size is set by the measured CPU budget (P3-T1 §5), not by a power analysis: the minimum meaningful differences
  # TH-1/TH-3 are still TBD (P0-T4 §10), so a power analysis cannot be run without inventing them.
  noise_floor:                         # evaluator noise floor (TH-1 method); clean references only, no candidate
    source: pairs_dev_pilot            # all 112 dev_pilot references
  impostor_pool:                       # clean test_core references for the impostor score distribution
    source: pairs_test_core            # all 700 test_core references

configurations:                        # P1-T5 §3 Tier A + baselines. Author defaults; no tuning in Phase 3.
  B0:  {kind: baseline, label: "Degraded input (no enhancement)"}
  B1:  {kind: baseline, label: "Lanczos-4 upscaling"}
  B2:  {kind: baseline, label: "Classical: Lanczos → NLM → unsharp"}
  B2c: {kind: baseline, label: "Classical + CLAHE (optional pre-step, master C7)"}
  A1:  {kind: face, label: RestoreFormer++, weights: [A01]}
  A2:  {kind: face, label: VQFR v1, weights: [A05]}
  A3:  {kind: general_sr, label: Real-ESRGAN x4plus, weights: [A02]}
  A4:  {kind: general_sr, label: SwinIR-L real-SR x4 GAN, weights: [A03]}
  A5:  {kind: chain, label: "FBCNN → NAFNet-SIDD → Real-ESRGAN", weights: [A04, A07, A02]}
  # Phase 5 Rapid additions (research-only, user decision 2026-10-04; licences: GFPGAN REVIEW, CodeFormer S-Lab NC)
  A6:  {kind: face, label: "GFPGAN v1.4", weights: [P5-GFPGAN]}
  A7:  {kind: face, label: "CodeFormer w=0.5", weights: [P5-CODEFORMER]}
  A8:  {kind: face, label: "CodeFormer w=1.0", weights: [P5-CODEFORMER]}

geometry:                              # src/fes_bench/geometry.py
  evaluation_frame: 224x224 clean reference chip (E-frame)
  face_model_frame: FFHQ-512 via recorded ffhq512_transform_2x3; D→F one INTER_CUBIC warp; border constant (135,133,132)
  face_model_back: INTER_AREA pre-reduction + INTER_LINEAR; uncovered E pixels = bicubic degraded input
  general_sr: native D-frame input, x4, then INTER_AREA (>224) / INTER_LANCZOS4 (<224) to 224
  eval_mask: {rule: E pixels covered by the F-frame canvas, erode_px: 2, applies_to: all configurations}

runtime:
  image: fes-dev:cpu-p2
  precision: fp32
  # Runtime-only change 2026-09-29, made BEFORE any main-population output existed (P3-T1 §11):
  # 3×4 → 4×2 after a throughput measurement under host background load (0.27 → 0.46 img/s, Real-ESRGAN 112 px).
  torch_threads_per_worker: 2          # >8 threads in one process collapses on this host (P3-T1 §5)
  workers: 4
  tile: 0
  outputs_root: experiments/phase5_rapid    # git-ignored (experiments/**/outputs/)
  output_format: PNG 8-bit sRGB, 224x224

metrics:
  quality: [psnr_rgb, ssim_y, lpips_alex_v0.1]           # full-reference, masked (P0-T4 §3A)
  descriptive: [sharpness_ratio, color_shift_dE76]
  geometry: [yunet_detected, yunet_landmark_nme]
  identity:
    evaluator: E01 SFace (face_recognition_sface_2021dec.onnx), test-only, single evaluator (G-2 open)
    alignment: reference landmarks for every image (fixed alignment)
    measures: [cos_to_ref, id_gain_vs_B0, impostor_cos, tar_at_far_1e-2 (threshold from clean-reference impostors)]
  not_used: [NIQE, MUSIQ, FID/KID, DISTS]     # no-reference / distribution metrics: real-world or large-N only

statistics:
  unit_of_resampling: reference (cluster bootstrap; 32 cells share an identity)
  bootstrap: {B: 2000, ci: 0.95, method: percentile, seed: 20260928}
  paired_comparison: per-pair difference vs B0 (and vs best classical), CI over references
  tie_rule: CI of the paired difference includes 0 → reported as "no detectable difference"
  thresholds: none — TH-1..TH-11 remain TBD (P0-T4 §10); results are descriptive
