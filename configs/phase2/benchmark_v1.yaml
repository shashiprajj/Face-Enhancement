# P2-T7 — Leakage-safe splits and benchmark selection for fes-syn-v1 (synthetic, FairFace-based).
name: fes-syn-v1
seed: 20260928
reference_manifest: data/manifests/references_v1.csv.gz
fairface_manifest: data/manifests/fairface_files_v1.csv.gz
out_dir: data/manifests/benchmark/fes-syn-v1
workers: 16

roles:                       # no training split: Phase 2 prepares evaluation data only (P0-T1 X8)
  dev:  {pool: dev_pool}     # threshold calibration / pilot variance (P1-T7 §7)
  test: {pool: test_pool}    # headline results, used once per frozen configuration

leakage:
  evaluator: models/E01_sface/face_recognition_sface_2021dec.onnx   # TEST-ONLY (P0 master C1), offline screening
  detector: models/D01_yunet/face_detection_yunet_2026may.onnx
  # 1:N screening threshold resolved from data: robust (median/MAD) impostor model; smallest t with expected
  # false exceedances over all dev×test pairs < max_expected_false. (First run with the fixed 1:1 value 0.363
  # flagged 90% of dev — a multiple-comparison artifact; see splits_report.json threshold_sweep.)
  max_expected_false: 1.0
  action: drop_dev           # a dev reference similar to ANY test reference is removed; test stays intact

subsets:                     # sample sizes are provisional (final N by power analysis on dev_pilot variance, P1-T7 §8)
  dev_pilot: {role: dev, per_stratum: 8, stratify_by: [race, gender]}     # 14 strata × 8 = 112 references
  test_core: {role: test, per_stratum: 50, stratify_by: [race, gender]}   # 14 strata × 50 = 700 references
